# ============================================================================
# ระบบออมทรัพย์โรงเรียนบ้านกะดาด — docker compose (app + db)
#
# ใช้: cp .env.example .env  ->  แก้ SESSION_SECRET/DB_PASSWORD  ->
#      docker compose up -d --build
#
# compose อ่านตัวแปร ${...} จากไฟล์ .env ข้างไฟล์นี้อัตโนมัติ
# หมายเหตุ: DATABASE_URL ใน .env มีไว้สำหรับ dev บนเครื่อง (localhost) —
#           ใน compose เราตั้ง DATABASE_URL ของ container เองให้ชี้ไป service "db"
# ============================================================================

# pin ชื่อ project ให้คงที่ — ไม่ผูกกับชื่อโฟลเดอร์ (กัน rename โฟลเดอร์แล้ว
# compose มองไม่เห็น volume เดิม -> สร้าง pgdata เปล่าใหม่ เหมือนข้อมูลหาย)
name: school-savings

services:
  app:
    build: .
    container_name: school-savings-app
    ports:
      - "3000:3000"
    environment:
      # ชี้ไป service db ผ่าน network ภายในของ compose
      DATABASE_URL: postgresql://savings:${DB_PASSWORD:?ต้องตั้ง DB_PASSWORD ใน .env}@db:5432/school_savings
      SESSION_SECRET: ${SESSION_SECRET:?ต้องตั้ง SESSION_SECRET ใน .env (สุ่มยาว >= 32 ตัวอักษร)}
      # Secure attribute ของ session cookie — default false เพราะ deploy นี้เป็น
      # plain HTTP ใน LAN (http://<ip>:3000) ถ้าติด Secure browser จะทิ้ง cookie
      # แล้ว login วนไม่ติด; ตั้ง true ใน .env เฉพาะเมื่อมี HTTPS reverse proxy ข้างหน้า
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # โฟลเดอร์เก็บไฟล์อัปโหลด (โลโก้โรงเรียน, รูปนักเรียน) — ผูกกับ volume "uploads"
      UPLOADS_DIR: /app/uploads
      # LINE แจ้งเตือน (optional) — ปล่อยว่าง = ปิดฟีเจอร์แจ้งเตือน LINE
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      TZ: Asia/Bangkok
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: school-savings-db
    # ตั้งใจ "ไม่" expose port ออก host — เข้าถึง DB ได้เฉพาะภายใน compose network
    # (backup/psql ให้ใช้ docker compose exec db ... ดู README.md)
    environment:
      POSTGRES_USER: savings
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ต้องตั้ง DB_PASSWORD ใน .env}
      POSTGRES_DB: school_savings
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savings -d school_savings"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # ฟีเจอร์ข้อ 16: สำรองฐานข้อมูลอัตโนมัติ (pg_dump ทุก 24 ชม. เก็บ 14 ไฟล์ล่าสุด)
  # เก็บลง volume "backups" — กู้คืน: gunzip < backup.sql.gz | docker compose exec -T db psql -U savings -d school_savings
  # ------------------------------------------------------------------------
  db-backup:
    image: postgres:17-alpine
    container_name: school-savings-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:?ต้องตั้ง DB_PASSWORD ใน .env}
      TZ: Asia/Bangkok
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # loop: dump -> gzip -> ลบไฟล์เกิน 14 ตัวล่าสุด -> sleep 24 ชม.
    # ($$ = escape ให้เป็น $ ของ shell ใน container; $ เดี่ยวคือค่าที่ compose interpolate)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # pipefail: ให้ exit code ของ pipeline สะท้อน pg_dump ที่ล้มเหลว ไม่ใช่แค่ gzip
        # (busybox ash ของ postgres:17-alpine รองรับ — ยืนยันแล้ว); ถ้าไม่ตั้ง pg_dump พัง
        # แต่ gzip compress สตรีมว่างสำเร็จ exit 0 -> log 'สำเร็จ' + เก็บ .gz ว่างทับ backup ดี
        set -o pipefail;
        echo "db-backup: เริ่มทำงาน — สำรองทุก 24 ชม. เก็บ 14 ไฟล์ล่าสุด";
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S);
          out="/backups/school_savings_$${ts}.sql.gz";
          echo "[$$(date '+%Y-%m-%d %H:%M:%S')] กำลังสำรอง -> $${out}";
          if pg_dump -h db -U savings -d school_savings | gzip > "$${out}"; then
            echo "[$$(date '+%Y-%m-%d %H:%M:%S')] สำรองสำเร็จ";
          else
            echo "[$$(date '+%Y-%m-%d %H:%M:%S')] สำรองล้มเหลว — ลบไฟล์ที่ค้าง"; rm -f "$${out}";
          fi;
          ls -1t /backups/school_savings_*.sql.gz 2>/dev/null | tail -n +15 | while read -r old; do
            echo "ลบ backup เก่า: $${old}"; rm -f "$${old}";
          done;
          sleep 86400;
        done
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  backups:
